version: '3.8'

services:
  neo4j:
    image: neo4j:5.20.0
    container_name: chain_sleuth_neo4j
    ports:
      - "7474:7474"  # Web Browser UI
      - "7687:7687"  # Bolt protocol (Python driver)
    environment:
      - NEO4J_AUTH=neo4j/chain_sleuth_password_123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs: